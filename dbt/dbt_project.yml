name: "beefy_databarn"
version: "1.0.0"
config-version: 2

profile: "beefy_databarn"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ["beefy_databarn", "dbt_utils"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  beefy_databarn:
    # One folder per layer (CONVENTIONS.md). The table is the model name: stg_/int_/dq_ in the dbt database,
    # dim_/fact_/mart_ in databarn. api and legacy have a database of their own and drop the prefix.
    staging:
      +schema: "{{ env_var('DBT_CLICKHOUSE_STAGING_DB', 'dbt') }}"
      +tags: ["staging"]
    intermediate:
      +schema: "{{ env_var('DBT_CLICKHOUSE_STAGING_DB', 'dbt') }}"
      +tags: ["intermediate"]
    data_quality:
      +schema: "{{ env_var('DBT_CLICKHOUSE_STAGING_DB', 'dbt') }}"
      +tags: ["data_quality"]
    dimensions:
      +schema: databarn
      +tags: ["dimensions"]
      +materialized: table
    facts:
      +schema: databarn
      +tags: ["facts"]
    marts:
      +schema: databarn
      +tags: ["marts"]
    api:
      +schema: api
      +tags: ["api"]
    # Temporary: views under the old analytics names, over the new tables, while readers move (CONVENTIONS.md).
    legacy:
      +schema: analytics
      +tags: ["legacy"]
      +materialized: view

data_tests:
  +severity: error # all tests default to error

vars:
  # When /mootokenprices started serving beefy-api PR 1966 (UTC). It deployed at 17:12:32, but our 17:15:03
  # snapshot still had the old scale; the 17:30:05 one is the first with the new scale.
  # Earlier snapshots are rescaled by stg_beefy_api__mootokenprices. That view bakes this value in when it is
  # created: after changing it, make dbt reimport stg_beefy_api__mootokenprices+ <day of the cutoff>.
  mootoken_price_fix_deployed_at: "2026-11-02 17:30:00"
