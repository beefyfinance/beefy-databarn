name: "beefy_databarn"
version: "1.0.0"
config-version: 2

profile: "beefy_databarn"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ["beefy_databarn", "dbt_utils"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  beefy_databarn:
    staging:
      +schema: "{{ env_var('DBT_CLICKHOUSE_STAGING_DB', 'dbt') }}"
      +tags: ["staging"]
    intermediate:
      +schema: "{{ env_var('DBT_CLICKHOUSE_STAGING_DB', 'dbt') }}"
      +tags: ["intermediate"]
    dimensions:
      +schema: "{{ env_var('DBT_CLICKHOUSE_DB', 'analytics') }}"
      +tags: ["dimensions"]
      +materialized: table
    marts:
      +schema: "{{ env_var('DBT_CLICKHOUSE_DB', 'analytics') }}"
      +tags: ["marts"]

data_tests:
  +severity: error # all tests default to error

vars:
  # When /mootokenprices started serving beefy-api PR 1966 (UTC). It deployed at 17:12:32, but the CDN served
  # the old response until 17:14:11. Earlier snapshots are rescaled by stg_beefy_api__mootokenprices.
  mootoken_price_fix_deployed_at: "2026-11-02 17:14:11"
