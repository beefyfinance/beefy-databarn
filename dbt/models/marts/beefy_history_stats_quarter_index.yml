version: 2

models:
  - name: beefy_history_stats_quarter_index
    description: >
      Every UTC quarter from the first counted launch through stats_end. Chart x-axis
      for launches/retirements, including quarters with no events.
    config:
      meta:
        primary_key: ["quarter"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - quarter
    columns:
      - name: quarter
        tests:
          - not_null
          - unique
      - name: quarter_start
        tests:
          - not_null
