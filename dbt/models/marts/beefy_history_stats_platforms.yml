version: 2

models:
  - name: beefy_history_stats_platforms
    description: >
      Counted vaults per platform. platform is platformId, or tokenProviderId for CLM;
      '' means none. active_now is still active at stats_end.
    config:
      meta:
        primary_key: ["platform"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - platform
    columns:
      - name: platform
        tests:
          - not_null
          - unique
      - name: launched
        tests:
          - not_null
      - name: active_now
        tests:
          - not_null
