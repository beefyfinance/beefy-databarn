version: 2

models:
  - name: asset_price_latest
    description: "Latest USD price of every asset priced in the last day (from asset_price_5m)."
    config:
      contract:
        enforced: true
      meta:
        primary_key: ["asset_id"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - asset_id
    columns:
      - name: asset_id
        description: "Price series (foreign key to asset.asset_id); tokens link with token.asset_id"
        data_type: UInt64
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('asset')
                field: asset_id
        meta:
          docglow:
            relationships:
              - to: asset
                field: asset_id
                kind: one_to_many
      - name: date_time
        description: "Time of the latest price (UTC)"
        data_type: DateTime('UTC')
        tests:
          - not_null
      - name: price
        description: "Latest USD price"
        data_type: Float64
        tests:
          - not_null
      - name: price_source
        description: "Source of the latest price (see asset_price_5m.price_source)"
        data_type: String
        tests:
          - not_null
