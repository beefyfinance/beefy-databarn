version: 2

models:
  - name: account_balance_daily
    description: "One row per account, token and UTC day with a nonzero balance at the end of the day, valued at the day's close (asset_price_1d) through token.asset_id. Built from account_balance_changes (balance carried from the last change). For a user timeline: WHERE account_address = ... ORDER BY date_day (the table is ordered by account). Re-priced when the resolver recomputes a price (int_price_runs)."
    config:
      meta:
        primary_key: ["account_address", "chain_id", "token_address", "date_day"]
        # Full refresh and reimport one month at a time (positions x days does not fit one query);
        # see infra/dbt/run_dbt_batched.py.
        batch: month
        batch_start: "2020-10-01"
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            where: "date_day >= today() - 30"
          arguments:
            combination_of_columns:
              - account_address
              - chain_id
              - token_address
              - date_day
    columns:
      - name: account_address
        description: "Account holding the token (foreign key to account.address)"
        data_type: String
        tests:
          - not_null
      - name: chain_id
        description: "Chain of the token (foreign key to chain.chain_id)"
        data_type: Int64
        tests:
          - not_null
      - name: token_address
        description: "Token representation address (with chain_id, foreign key to token)"
        data_type: String
        tests:
          - not_null
      - name: date_day
        description: "UTC day"
        data_type: Date
        tests:
          - not_null
      - name: asset_id
        description: "Price series of the token (token.asset_id); NULL when the token has none"
        data_type: Nullable(UInt64)
      - name: balance
        description: "Balance at the end of the day, whole tokens (nonzero)"
        data_type: Decimal(76, 20)
        tests:
          - not_null
      - name: price_usd
        description: "Close of the day (asset_price_1d.close); NULL when unpriced"
        data_type: Nullable(Float64)
      - name: balance_usd
        description: "balance * price_usd"
        data_type: Nullable(Float64)
