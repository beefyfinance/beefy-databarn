version: 2

models:
  - name: beefy_history_objects
    description: >
      One row per catalog object (kind:chain:address). Filter this for search, /inactive,
      /o/[objectId], and /stats object-level numbers (launches, retirements, platforms,
      lifespan, headline). Use beefy_history_events windows for active-over-time.

      /inactive: WHERE is_inactive
      /stats launches: WHERE counts_for_stats GROUP BY launch_quarter, vault_type
      /stats retirements: WHERE counts_for_stats AND is_retired GROUP BY retirement_quarter, retire_reason_group
      /stats platforms: WHERE counts_for_stats GROUP BY stats_platform
      /stats lifespan: WHERE counts_for_stats AND is_retired GROUP BY lifespan_months
      /stats tiles: WHERE counts_for_stats — countIf(is_currently_active), countIf(is_retired), …
    config:
      meta:
        primary_key: ["object_id"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - object_id
    columns:
      - name: object_id
        description: "kind:chain:address"
        tests:
          - not_null
          - unique
      - name: kind
        description: "vault or boost"
        tests:
          - not_null
      - name: chain
        tests:
          - not_null
      - name: address
        tests:
          - not_null
      - name: beefy_id
        description: "Latest config id"
      - name: beefy_ids
        description: "Every id, first-seen order"
      - name: name
        description: "data.name, or data.title for promos boosts"
      - name: live
        description: "Latest change is not removed"
        tests:
          - not_null
      - name: removed_at
        description: "last_committed_at when not live; null while live"
      - name: is_currently_active
        description: "In catalog with status missing/empty/active"
        tests:
          - not_null
      - name: is_inactive
        description: "The /inactive list: not currently active"
        tests:
          - not_null
      - name: counts_for_stats
        description: "Ever-active vault that is not a CLM wrapper; null for boosts"
      - name: is_retired
        description: "Ended last active period and not paused; null for boosts"
      - name: is_clm_wrapper
        description: "gov/standard whose deposit token is a cowcentrated vault; null for boosts"
      - name: clm_parent_address
        description: "CLM this gov/standard wraps, if any"
      - name: stats_platform
        description: "platformId, or tokenProviderId for CLM"
      - name: retire_reason_group
        description: "rewards | tvl | upgrade | incident | other | none"
      - name: launch_quarter
        description: "YYYY-Qn of first in-catalog active observation"
      - name: retirement_quarter
        description: "YYYY-Qn of last active period end when retired"
      - name: lifespan_months
        description: "Whole 30.4375-day months from launch to retirement; null if not retired"
      - name: data
        description: "Latest non-null config JSON"
