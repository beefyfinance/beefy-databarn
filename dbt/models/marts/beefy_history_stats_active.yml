version: 2

models:
  - name: beefy_history_stats_active
    description: >
      Active counted vaults at each /stats sample (Mondays, month-starts, stats_end),
      by chain and vault_type. Dense: every chain×type that ever launched has a 0-filled
      row at every sample. GROUP BY chain for activeByChain; GROUP BY vault_type for
      activeByType.
    config:
      meta:
        primary_key: ["sampled_at", "chain", "vault_type"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sampled_at
              - chain
              - vault_type
    columns:
      - name: sampled_at
        tests:
          - not_null
      - name: chain
        tests:
          - not_null
      - name: vault_type
        tests:
          - not_null
      - name: active_count
        tests:
          - not_null
