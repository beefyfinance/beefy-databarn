version: 2

models:
  - name: beefy_history_stats_lifespan
    description: >
      Retired counted vaults by whole months from launch to retirement (30.4375-day
      months). Row n is the API's lifespanMonths[n]. Gaps through the max are 0-filled.
    config:
      meta:
        primary_key: ["months"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - months
    columns:
      - name: months
        tests:
          - not_null
          - unique
      - name: vault_count
        tests:
          - not_null
