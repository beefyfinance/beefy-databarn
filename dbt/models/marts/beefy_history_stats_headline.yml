version: 2

models:
  - name: beefy_history_stats_headline
    description: >
      Single-row /stats headline (active now, peak, chains, launched, retired, median
      lifespan in whole months). Empty when no counted vault exists.
    columns:
      - name: stats_end
        tests:
          - not_null
      - name: active_now
        tests:
          - not_null
      - name: peak
        tests:
          - not_null
      - name: launched
        tests:
          - not_null
      - name: retired
        tests:
          - not_null
