version: 2

models:
  - name: beefy_history_commits
    description: >
      One row per git commit that produced catalog events. Join beefy_history_events
      on (commit_repo, commit_sha) for the /commits/[repo]/[sha] event list.
    config:
      meta:
        primary_key: ["commit_repo", "commit_sha"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - commit_repo
              - commit_sha
    columns:
      - name: commit_repo
        tests:
          - not_null
      - name: commit_sha
        tests:
          - not_null
      - name: committed_at
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
