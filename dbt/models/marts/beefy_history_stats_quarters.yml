version: 2

models:
  - name: beefy_history_stats_quarters
    description: >
      /stats quarterly launches and retirements, long form. series is launched_type,
      launched_chain, or retired_reason. Only non-zero counts. reason_group maps
      retireReason the same way as history.beefy.rodeo/stats. Use
      beefy_history_stats_quarter_index for the full quarter axis (including empty).
    config:
      meta:
        primary_key: ["quarter", "series", "series_key"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - quarter
              - series
              - series_key
    columns:
      - name: quarter
        description: "YYYY-Qn"
        tests:
          - not_null
      - name: series
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['launched_type', 'launched_chain', 'retired_reason']
      - name: series_key
        description: "vault_type, chain, or retireReason ('' = none given)"
        tests:
          - not_null
      - name: reason_group
        description: "rewards | tvl | upgrade | incident | other | none; null unless retired_reason"
      - name: vault_count
        tests:
          - not_null
