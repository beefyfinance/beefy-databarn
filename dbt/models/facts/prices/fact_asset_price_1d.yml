version: 2

models:
  - name: fact_asset_price_1d
    description: "Daily (UTC) OHLC USD price of assets, from fact_asset_price_5m. Small enough for an ASOF join on asset_id and date_day. Rebuilt for the days each fact_asset_price_5m run resolved or recomputed (int_price_runs)."
    config:
      contract:
        enforced: true
      meta:
        primary_key: ["asset_id", "date_day"]
        # Reimport one month at a time (a rollup of the whole 5-minute table does not fit one query);
        # see infra/dbt/run_dbt_batched.py.
        batch: month
        batch_start: "2020-10-01"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - asset_id
              - date_day
    columns:
      - name: asset_id
        description: "Price series (foreign key to asset.asset_id); tokens link with token.asset_id"
        data_type: UInt64
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: asset_id
        meta:
          docglow:
            relationships:
              - to: dim_asset
                field: asset_id
                kind: one_to_many
      - name: date_day
        description: "UTC day"
        data_type: Date
        tests:
          - not_null
      - name: open
        description: "First price of the day"
        data_type: Float64
        tests:
          - not_null
      - name: high
        description: "Highest price of the day"
        data_type: Float64
        tests:
          - not_null
      - name: low
        description: "Lowest price of the day"
        data_type: Float64
        tests:
          - not_null
      - name: close
        description: "Last price of the day"
        data_type: Float64
        tests:
          - not_null
      - name: avg_price
        description: "Average of the 5-minute prices of the day"
        data_type: Float64
        tests:
          - not_null
      - name: sample_count
        description: "Number of 5-minute prices in the day (288 for an asset priced all day)"
        data_type: UInt32
        tests:
          - not_null
