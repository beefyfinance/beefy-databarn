version: 2

models:
  - name: fact_chain_stats_1h
    description: "Timeseries of chain-level statistics including TVL, APR/APY, and fee metrics aggregated from fact_product_stats_1h. Includes averages and quantile distributions (min, p25, p50, p75, max) for APR/APY and fee fields."
    config:
      contract:
        enforced: true
      meta:
        primary_key: ["chain_id", "date_hour"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chain_id
              - date_hour
    columns:
      - name: chain_id
        description: "Chain ID (foreign key to chain.chain_id)"
        data_type: Int64
        codec: ZSTD(3)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_chain')
                field: chain_id
      - name: chain_name
        description: "Human-readable chain name"
        data_type: String
        codec: LZ4
        tests:
          - not_null
      - name: beefy_key
        description: "Beefy-specific chain identifier (foreign key to chain.beefy_key)"
        data_type: String
        codec: LZ4
        tests:
          - not_null
      - name: beefy_enabled
        description: "Whether the chain is currently enabled on Beefy"
        data_type: Bool
        codec: LZ4
        tests:
          - not_null
      - name: date_hour
        description: "Date hour when this snapshot was captured"
        data_type: DateTime('UTC')
        codec: DoubleDelta, LZ4
        tests:
          - not_null
      - name: tvl_usd
        description: "Total value locked in USD across all product types (vault + gov + CLM)"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000000
                inclusive: true
      - name: vault_tvl_usd
        description: "TVL attributed to vault assets in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: clm_tvl_usd
        description: "TVL attributed to CLM (Concentrated Liquidity Manager) assets in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apy
        description: "Average apy over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: avg_apy_vault
        description: "Average vault APY (apy_vault) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_vault
        description: "Average vault APR (apr_vault) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_trading
        description: "Average trading APR (apr_trading) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_clm
        description: "Average CLM APR (apr_clm) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_reward_pool
        description: "Average reward pool APR (apr_reward_pool) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_reward_pool_trading
        description: "Average reward pool trading APR (apr_reward_pool_trading) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_liquid_staking
        description: "Average liquid staking APR (apr_liquid_staking) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_composable_pool
        description: "Average composable pool APR (apr_composable_pool) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_merkl
        description: "Average Merkl APR (apr_merkl) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_apr_linea_ignition
        description: "Average Linea Ignition APR (apr_linea_ignition) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_fee_rate_performance
        description: "Average performance fee rate (fee_rate_performance) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_fee_rate_lp
        description: "Average LP fee rate (fee_rate_lp) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: avg_compoundings_per_year
        description: "Average compoundings per year (compoundings_per_year) over the chain's products that have one"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: apy_quantiles
        description: "[min, p25, p50, p75, max] of apy over the chain's products (NULLs excluded)"
        data_type: Array(Float64)
        codec: LZ4
      - name: apy_vault_quantiles
        description: "[min, p25, p50, p75, max] of apy_vault over the chain's products (NULLs excluded)"
        data_type: Array(Float64)
        codec: LZ4
      - name: fee_rate_performance_quantiles
        description: "[min, p25, p50, p75, max] of fee_rate_performance over the chain's products (NULLs excluded)"
        data_type: Array(Float64)
        codec: LZ4
      - name: fee_rate_lp_quantiles
        description: "[min, p25, p50, p75, max] of fee_rate_lp over the chain's products (NULLs excluded)"
        data_type: Array(Float64)
        codec: LZ4
      - name: compoundings_per_year_quantiles
        description: "[min, p25, p50, p75, max] of compoundings_per_year over the chain's products (NULLs excluded)"
        data_type: Array(Float64)
        codec: LZ4
      - name: harvest_count
        description: "Distinct harvest transactions in the hour, over the chain's products"
        data_type: Nullable(UInt64)
        codec: ZSTD(3)
      - name: harvest_product_count
        description: "Products with at least one harvest in the hour"
        data_type: UInt64
        codec: ZSTD(3)
      - name: harvest_amount
        description: "Sum over the chain's products of the hour's want compounded, in want token units (mixed tokens: use the USD value)"
        data_type: Nullable(Decimal(76, 20))
        codec: ZSTD(3)
      - name: harvest_amount_usd
        description: "Sum over the chain's products of the hour's want compounded, in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: harvest_call_fee
        description: "Sum over the chain's products of the hour's harvest call fees, in native token"
        data_type: Nullable(Decimal(76, 20))
        codec: ZSTD(3)
      - name: harvest_call_fee_usd
        description: "Sum over the chain's products of the hour's harvest call fees, in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: harvest_gas_fee
        description: "Sum over the chain's products of the hour's gas paid by harvests, in native token"
        data_type: Nullable(Decimal(76, 20))
        codec: ZSTD(3)
      - name: harvest_gas_fee_usd
        description: "Sum over the chain's products of the hour's gas paid by harvests, in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: harvest_platform_fee
        description: "Sum over the chain's products of the hour's platform fees, in native token"
        data_type: Nullable(Decimal(76, 20))
        codec: ZSTD(3)
      - name: harvest_platform_fee_usd
        description: "Sum over the chain's products of the hour's platform fees, in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: harvest_strategist_fee
        description: "Sum over the chain's products of the hour's strategist fees, in native token"
        data_type: Nullable(Decimal(76, 20))
        codec: ZSTD(3)
      - name: harvest_strategist_fee_usd
        description: "Sum over the chain's products of the hour's strategist fees, in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
      - name: harvest_native_price_usd
        description: "Average native token price over the products harvested in the hour, in USD"
        data_type: Nullable(Float64)
        codec: ZSTD(3)
