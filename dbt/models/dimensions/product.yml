version: 2

models:
  - name: product
    description: "Dimension table for product (vault) reference data. Provides product/vault metadata for joining with fact tables."
    config:
      contract:
        enforced: true
      meta:
        primary_key: ["chain_id", "product_address"]
    tests:
      - keys_match:
          name: product_in_int_product_keys
          config:
            store_failures: true
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address", "beefy_key", "beefy_price_oracle_key"]
            to_columns: ["chain_id", "product_address", "beefy_key", "oracle_key"]
      - stg_api_ids_in_product:
          name: stg_clm_vaults_in_product
          config:
            severity: warn
            store_failures: true
          arguments:
            from_model: ref('stg_beefy_api__clm_vaults')
            where_clause: "ifNull(is_gov_vault, false) = false"
      - stg_api_ids_in_product:
          name: stg_classic_vaults_in_product
          config:
            severity: warn
            store_failures: true
          arguments:
            from_model: ref('stg_beefy_api__vaults')
            where_clause: "ifNull(is_gov_vault, false) = false"
    columns:
      - name: chain_id
        description: "Chain ID where the product exists"
        data_type: Int64
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('chain')
                field: chain_id
      - name: product_type
        description: "Type of product (classic_vault, clm_manager, classic_boost, or reward_pool)"
        data_type: String
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['classic_vault', 'clm_manager', 'classic_boost', 'reward_pool']
      - name: product_address
        description: "Product contract address"
        data_type: String
        tests:
          - not_null
      - name: beefy_key
        description: "Beefy-specific vault/product identifier"
        data_type: String
        tests:
          - not_null
      - name: beefy_price_oracle_key
        description: "Oracle ID used for price lookups (from stg_beefy_api models, defaults to beefy_key if null)"
        data_type: String
        tests:
          - not_null
      - name: display_name
        description: "Product/vault display name"
        data_type: String
        tests:
          - not_null
      - name: is_active
        description: "Whether the vault is currently active"
        data_type: Bool
        tests:
          - not_null
      - name: platform_id
        description: "Platform identifier"
        data_type: Nullable(String)
        tests:
          - relationships:
              arguments:
                to: ref('platform')
                field: platform_id
      - name: creation_block
        description: "Block number when the product was initialized (from envio)"
        data_type: Nullable(Int64)
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or creation_block != 0"
      - name: creation_datetime
        description: "Timestamp when the product was initialized (from envio)"
        data_type: Nullable(DateTime64(3, 'UTC'))
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or creation_datetime >= '2020-01-01'"
      - name: declared_creation_date
        description: "User-declared creation date from the API (created_at). Null for boosts."
        data_type: Nullable(DateTime64(3, 'UTC'))
