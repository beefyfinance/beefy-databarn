version: 2

sources:
  - name: dlt
    description: "Source data from dlt database"
    database: dlt
    schema: dlt
    tables:
      # beefy_api tables
      - name: beefy_api___vaults
        description: "Vault configurations from Beefy API"
      - name: beefy_api___tokens
        description: "Token configurations from Beefy API"
      - name: beefy_api___clm_vaults
        description: "CLM vault configurations from Beefy API"
      - name: beefy_api____dlt_loads
        description: "DLT load metadata for beefy_api pipeline (load_id, inserted_at)"
      - name: beefy_db____dlt_loads
        description: "DLT load metadata for beefy_db pipeline (load_id, inserted_at)"
      - name: github_files____dlt_loads
        description: "DLT load metadata for github_files pipeline (load_id, inserted_at)"
      - name: beefy_cctp_api____dlt_loads
        description: "DLT load metadata for beefy_cctp_api pipeline (load_id, inserted_at)"
      - name: beefy_clm_subgraph____dlt_loads
        description: "DLT load metadata for beefy_clm_subgraph pipeline (load_id, inserted_at)"
      - name: beefy_api___cow_vaults
        description: "COW vault configurations from Beefy API"
      - name: beefy_api___gov_vaults
        description: "Governance vault configurations from Beefy API"
      - name: beefy_api___boosts
        description: "Boost configurations from Beefy API"
      # beefy_db tables
      - name: beefy_db___chains
        description: "Chain reference data from Beefy database"
      - name: beefy_db___vault_strategies
        description: "Vault strategy configurations from Beefy database"
      - name: beefy_db___address_metadata
        description: "Address metadata from Beefy database"
      - name: beefy_db___bifi_buyback
        description: "BIFI buyback events from Beefy database"
      - name: beefy_db___feebatch_harvests
        description: "Fee batch harvest events from Beefy database"
      - name: beefy_db___vault_ids
        description: "Vault ID mappings from Beefy database"
      - name: beefy_db___price_oracles
        description: "Price oracle configurations from Beefy database"
      # beefy_api tables
      - name: beefy_api___apy
        description: "APY snapshots from Beefy API"
      - name: beefy_api___treasury
        description: "Treasury snapshots from Beefy API"
      - name: beefy_api___tvl
        description: "TVL snapshots from Beefy API"
      - name: beefy_api___prices
        description: "Price snapshots from Beefy API"
      - name: beefy_api___lps
        description: "LP snapshots from Beefy API"
      - name: beefy_api___lps_breakdown
        description: "LP breakdown snapshots from Beefy API"
      - name: beefy_api___apy_breakdown
        description: "APY breakdown snapshots from Beefy API"
      - name: beefy_api___mootokenprices
        description: "MOO token price snapshots from Beefy API"
      # beefy_db tables
      - name: beefy_db___harvests
        description: "Harvest events from Beefy database"
      - name: beefy_db___prices
        description: "Price data from Beefy database"
      - name: beefy_db___apys
        description: "APY time series from Beefy database"
      - name: beefy_db___tvls
        description: "Vault TVL time series from Beefy database"
      - name: beefy_db___tvl_by_chain
        description: "Chain-level TVL time series from Beefy database"
      - name: beefy_db___zap_records
        description: "Zap event records from Beefy database"
      - name: beefy_db___zap_parent_transactions
        description: "Parent transactions for zap events from Beefy database"
      - name: beefy_db___zap_token_transfers_v2
        description: "Zap token transfer rows v2 (inputs/outputs/refunds per zap event) from Beefy database"
      # github_files tables
      - name: github_files___beefy_platforms
        description: "Beefy platform configurations from GitHub files"
      - name: github_files___beefy_ui_chains
        description: "Beefy UI chain configurations from GitHub files"
      # beefy_cctp_api tables
      - name: beefy_cctp_api___messages
        description: "CCTP relay messages from Beefy CCTP API"
      # databarn_v1 tables
      - name: databarn_v1___products
        description: "Databarn v1 products, one row per product_id."
      - name: databarn_v1___price_feeds
        description: "Databarn v1 price feeds, one row per price_feed_id."
      - name: databarn_v1___investors
        description: "Databarn v1 investors, one row per investor_id."
      - name: databarn_v1___import_states
        description: "Databarn v1 import progress, one row per import_key."
      - name: databarn_v1___prices_raw
        description: "Every price imported by databarn v1, one row per (price_feed_id, datetime, block_number)."
      - name: databarn_v1___prices_1h
        description: "Hourly databarn v1 prices, one row per (price_feed_id, datetime). The API keeps 6 months; this table keeps what was read."
      - name: databarn_v1___prices_1d
        description: "Daily databarn v1 prices, one row per (price_feed_id, datetime)."
      - name: databarn_v1___vault_stats
        description: "Databarn v1 vault metrics, one row per (product_id, datetime, block_number)."
      - name: databarn_v1___investor_timeline
        description: "Databarn v1 investor balance changes, one row per (product_id, investor_id, datetime, block_number)."
      # beefy_clm_subgraph tables
      - name: beefy_clm_subgraph___subgraph_status
        description: "Subgraph status from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clms
        description: "Clms from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___classics
        description: "Classics from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___tokens
        description: "Tokens from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clm_snapshots
        description: "Clm snapshots from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___classic_snapshots
        description: "Classic snapshots from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clm_position_interactions
        description: "Clm position interactions from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___classic_position_interactions
        description: "Classic position interactions from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clm_harvest_events
        description: "Clm harvest events from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clm_manager_collection_events
        description: "Clm manager collection events from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clm_deposit_events
        description: "Clm deposit events from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clm_withdraw_events
        description: "Clm withdraw events from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___clm_strategy_tvl_events
        description: "Clm strategy tvl events from the Beefy CLM subgraph"
      - name: beefy_clm_subgraph___transactions
        description: "Transactions from the Beefy CLM subgraph"
