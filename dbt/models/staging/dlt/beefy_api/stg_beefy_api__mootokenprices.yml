version: 2

models:
  - name: stg_beefy_api__mootokenprices
    description: "Staging model for moo token prices from dlt beefy_api dataset"
    columns:
      - name: etag
        description: "ETag for this data snapshot (part of primary key)"
        tests:
          - not_null
      - name: chain_id
        description: "Chain identifier (part of primary key)"
        tests:
          - not_null
      - name: moo_token_symbol
        description: "Moo token symbol (part of primary key)"
        tests:
          - not_null
      - name: price
        description: "USD value of 1e18 raw share units. Snapshots before var mootoken_price_fix_deployed_at are rescaled by 10^(18 - want decimals) to this unit."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: date_time
        description: "Timestamp when this data was captured"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            where: "date_time >= now('UTC') - interval 7 day"
          arguments:
            combination_of_columns:
              - etag
              - chain_id
              - moo_token_symbol

