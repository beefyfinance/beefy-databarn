version: 2

models:
  - name: stg_beefy_api__lps
    description: "Staging model for LP data from dlt beefy_api dataset"
    columns:
      - name: etag
        description: "ETag for this data snapshot (part of primary key)"
        tests:
          - not_null
      - name: vault_id
        description: "Vault identifier (part of primary key)"
        tests:
          - not_null
      - name: lps
        description: "Liquidity provider shares"
        tests:
          - not_null
      - name: date_time
        description: "Timestamp when this data was captured"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            where: "date_time >= now('UTC') - interval 7 day"
          arguments:
            combination_of_columns:
              - etag
              - vault_id

