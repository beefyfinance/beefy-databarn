version: 2

models:
  - name: stg_beefy_db__zap_parent_transactions
    description: "Staging model for zap parent transactions from dlt beefy_db dataset"
    columns:
      - name: network_id
        description: "Network ID of the parent transaction (references chain.network_id)"
        data_type: Int64
        tests:
          - not_null
      - name: block_number
        description: "Block number of the parent transaction"
        data_type: Int64
        tests:
          - not_null
      - name: txn_idx
        description: "Transaction index within the block"
        data_type: Int32
        tests:
          - not_null
      - name: txn_timestamp
        description: "Timestamp of the parent transaction"
        data_type: DateTime64(6, 'UTC')
        tests:
          - not_null
      - name: txn_hash
        description: "Transaction hash"
        data_type: String
        tests:
          - not_null
      - name: value
        description: "Native token value transferred"
        data_type: Decimal256(20)
      - name: effective_gas_price
        description: "Effective gas price paid"
        data_type: Int64
      - name: gas_limit
        description: "Gas limit of the transaction"
        data_type: Int64
      - name: gas_used
        description: "Gas used by the transaction"
        data_type: Int64
      - name: native_price
        description: "Native token USD price at transaction time"
        data_type: Decimal256(20)
      - name: from_address
        description: "Transaction sender address"
        data_type: String
        tests:
          - not_null
      - name: to_address
        description: "Transaction recipient address"
        data_type: String
        tests:
          - not_null
      - name: calldata
        description: "Transaction calldata (hex-encoded)"
        data_type: String
      - name: success
        description: "Whether the transaction succeeded"
        data_type: Bool
        tests:
          - not_null
      - name: created_at
        description: "When the record was created"
        data_type: DateTime64(6, 'UTC')
        tests:
          - not_null
