version: 2

models:
  - name: stg_beefy_db__tvl_by_chain
    description: "Staging model for chain-level TVL time series from dlt beefy_db dataset"
    columns:
      - name: chain_id
        description: "Internal chain id (stg_beefy_db__chain_ids.chain_id), not the EVM network id"
        data_type: Int64
        codec: Delta, LZ4
        tests:
          - not_null
      - name: chain_key
        description: "Beefy chain key (bsc, ethereum, ...)"
        tests:
          - not_null
      - name: network_id
        description: "EVM network id (references stg_beefy_db__chains.network_id); NULL for a chain missing from the chains table"
        data_type: Nullable(Int64)
      - name: date_time
        description: "Timestamp for the chain TVL observation"
        data_type: DateTime64(6, 'UTC')
        codec: DoubleDelta, LZ4
        tests:
          - not_null
      - name: tvl_usd
        description: "Total TVL across vault, gov, and CLM"
        data_type: Decimal256(20)
        codec: ZSTD(3)
      - name: vault_tvl_usd
        description: "TVL attributed to vault assets"
        data_type: Decimal256(20)
        codec: ZSTD(3)
      - name: gov_tvl_usd
        description: "TVL attributed to governance assets"
        data_type: Decimal256(20)
        codec: ZSTD(3)
      - name: clm_tvl_usd
        description: "TVL attributed to CLM assets"
        data_type: Decimal256(20)
        codec: ZSTD(3)

