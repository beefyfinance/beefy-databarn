version: 2

models:
  - name: stg_beefy_clm_subgraph__classic_position_interactions
    description: "Beefy CLM subgraph classic position interactions, one row per (chain_key, subgraph_key)."
    config:
      meta:
        primary_key: ["chain_key", "subgraph_key"]
    columns:
      - name: chain_key
        description: "Subgraph chain slug, for example base"
      - name: subgraph_key
        description: "Subgraph entity id, unique per chain"
      - name: classic_address
        description: "Classic address"
      - name: trx_hash
        description: "Transaction hash"
      - name: log_index
        description: "Log index within the transaction"
      - name: block_timestamp
        description: "Block time"
      - name: block_number
        description: "Block number"
      - name: investor_address
        description: "Investor address"
      - name: investor_position_key
        description: "Subgraph id of the investor position"
      - name: interaction_type
        description: "Position interaction type"
      - name: vault_balance
        description: "Vault balance (raw integer)"
      - name: boost_balance
        description: "Boost balance (raw integer)"
      - name: reward_pool_balances
        description: "Reward pool balances (token order in the matching current-state *_order column)"
      - name: erc4626_adapter_balances
        description: "Erc4626 adapter balances (token order in the matching current-state *_order column)"
      - name: erc4626_adapter_vault_shares_balances
        description: "Erc4626 adapter vault shares balances (token order in the matching current-state *_order column)"
      - name: total_balance
        description: "Total balance (raw integer)"
      - name: vault_shares_total_supply
        description: "Vault shares total supply (raw integer)"
      - name: vault_underlying_total_supply
        description: "Vault underlying total supply (raw integer)"
      - name: vault_underlying_breakdown_balances
        description: "Vault underlying breakdown balances (token order in the matching current-state *_order column)"
      - name: vault_underlying_amount
        description: "Vault underlying amount (raw integer)"
      - name: vault_underlying_balance
        description: "Vault underlying balance (raw integer)"
      - name: vault_balance_delta
        description: "Vault balance delta (raw integer)"
      - name: boost_balance_delta
        description: "Boost balance delta (raw integer)"
      - name: boost_reward_balances_delta
        description: "Boost reward balances delta (token order in the matching current-state *_order column)"
      - name: reward_pool_balances_delta
        description: "Reward pool balances delta (token order in the matching current-state *_order column)"
      - name: reward_balances_delta
        description: "Reward balances delta (token order in the matching current-state *_order column)"
      - name: erc4626_adapter_balances_delta
        description: "Erc4626 adapter balances delta (token order in the matching current-state *_order column)"
      - name: erc4626_adapter_vault_shares_balances_delta
        description: "Erc4626 adapter vault shares balances delta (token order in the matching current-state *_order column)"
      - name: underlying_to_native_price
        description: "Underlying to native price (raw integer)"
      - name: underlying_breakdown_to_native_prices
        description: "Underlying breakdown to native prices (token order in the matching current-state *_order column)"
      - name: boost_reward_to_native_prices
        description: "Boost reward to native prices (token order in the matching current-state *_order column)"
      - name: reward_to_native_prices
        description: "Reward to native prices (token order in the matching current-state *_order column)"
      - name: native_to_usd_price
        description: "Native to usd price (raw integer)"
