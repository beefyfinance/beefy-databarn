version: 2

models:
  - name: stg_beefy_clm_subgraph__latest_dlt_loads
    description: >
      One row per beefy_clm_subgraph table: the newest completed dlt load (status 0)
      that wrote that table. Materialized so the rest of the dbt run cannot see
      a load that lands after this table is built.
    config:
      meta:
        primary_key: ["resource_name"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - resource_name
      - latest_dlt_load_id_completed:
          arguments:
            dlt_source: beefy_clm_subgraph
      - latest_dlt_load_id_in_resource:
          arguments:
            dlt_source: beefy_clm_subgraph
            resources:
              - subgraph_status
              - clms
              - classics
              - tokens
              - clm_snapshots
              - classic_snapshots
              - clm_position_interactions
              - classic_position_interactions
              - clm_harvest_events
              - clm_manager_collection_events
              - clm_deposit_events
              - clm_withdraw_events
              - clm_strategy_tvl_events
              - transactions
    columns:
      - name: source_name
        description: "dlt dataset / pipeline name"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['beefy_clm_subgraph']
      - name: resource_name
        description: "dlt resource / table name (e.g. clm_snapshots)"
        tests:
          - not_null
      - name: load_id
        description: "Completed dlt load_id to read for this resource"
        tests:
          - not_null
      - name: inserted_at
        description: "When that load was marked complete"
        tests:
          - not_null
