version: 2

models:
  - name: stg_beefy_clm_subgraph__clm_harvest_events
    description: "Beefy CLM subgraph clm harvest events, one row per (chain_key, subgraph_key)."
    config:
      meta:
        primary_key: ["chain_key", "subgraph_key"]
    columns:
      - name: chain_key
        description: "Subgraph chain slug, for example base"
      - name: subgraph_key
        description: "Subgraph entity id, unique per chain"
      - name: clm_address
        description: "Clm address"
      - name: trx_hash
        description: "Transaction hash"
      - name: log_index
        description: "Log index within the transaction"
      - name: block_timestamp
        description: "Block time"
      - name: block_number
        description: "Block number"
      - name: strategy_address
        description: "Strategy address"
      - name: underlying_amount0
        description: "Underlying amount0 (raw integer)"
      - name: underlying_amount1
        description: "Underlying amount1 (raw integer)"
      - name: compounded_amount0
        description: "Compounded amount0 (raw integer)"
      - name: compounded_amount1
        description: "Compounded amount1 (raw integer)"
      - name: collected_output_amounts
        description: "Collected output amounts (token order in the matching current-state *_order column)"
      - name: manager_total_supply
        description: "Manager total supply (raw integer)"
      - name: reward_pools_total_supply
        description: "Reward pools total supply (token order in the matching current-state *_order column)"
      - name: token0_to_native_price
        description: "Token0 to native price (raw integer)"
      - name: token1_to_native_price
        description: "Token1 to native price (raw integer)"
      - name: output_to_native_prices
        description: "Output to native prices (token order in the matching current-state *_order column)"
      - name: reward_to_native_prices
        description: "Reward to native prices (token order in the matching current-state *_order column)"
      - name: native_to_usd_price
        description: "Native to usd price (raw integer)"
