version: 2

models:
  - name: stg_databarn_v1__prices_raw
    description: "Every price imported by databarn v1, one row per (price_feed_id, datetime, block_number)."
    config:
      meta:
        primary_key: ["price_feed_id", "datetime", "block_number"]
    columns:
      - name: datetime
        description: "Block datetime, UTC"
      - name: price_feed_id
        description: "Price feed"
      - name: block_number
        description: "Block number"
      - name: price
        description: "Price, to 20 decimals"
