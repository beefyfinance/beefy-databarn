version: 2

models:
  - name: int_product_stats__lps_breakdown_hourly
    description: "Hourly LPS breakdown aggregations"
    tests:
      - keys_match:
          name: int_product_stats__lps_breakdown_hourly_in_int_product_keys
          config:
            store_failures: true
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address"]
      - keys_match:
          name: int_product_stats__lps_breakdown_hourly_in_unified
          config:
            store_failures: true
            where: "date_hour >= toStartOfHour(now('UTC')) - interval 2 day"
          arguments:
            to: ref('int_product_stats__unified_hourly')
            columns: ["chain_id", "product_address", "date_hour"]
            to_where: "source = 'lps_breakdown' and date_hour >= toStartOfHour(now('UTC')) - interval 2 day"
    columns:
      - name: lp_price
        description: "LP token price"
        data_type: float64
        constraints:
          - type: not_null
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: total_supply
        description: "Total supply"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000000
                inclusive: true
      - name: underlying_liquidity
        description: "Underlying liquidity"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000000
                inclusive: true
      - name: underlying_price
        description: "Underlying price"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
