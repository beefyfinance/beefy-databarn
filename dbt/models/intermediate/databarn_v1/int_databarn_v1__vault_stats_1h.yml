version: 2

models:
  - name: int_databarn_v1__vault_stats_1h
    description: "Last databarn v1 vault stats of each hour with the want price, one row per (chain_id, product_address, date_hour). Fallback for TVL and LP breakdown columns."
    config:
      meta:
        primary_key: ["chain_id", "product_address", "date_hour"]
        # make dbt reimport/refresh run this model one month at a time (a full history of
        # stats joined to oracle prices does not fit in 30 GiB); see infra/dbt/run_dbt_batched.py.
        # A first build needs make dbt refresh: a plain dbt run reads the whole history at once.
        batch: month
        batch_start: "2021-07-31"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chain_id
              - product_address
              - date_hour
    columns:
      - name: chain_id
        description: "Chain ID where the vault exists"
        tests:
          - not_null
      - name: product_address
        description: "Vault contract address"
        tests:
          - not_null
      - name: date_hour
        description: "Hour of the stats"
        tests:
          - not_null
      - name: staked_underlying
        description: "Want tokens held by the vault"
      - name: underlying_total_supply
        description: "Total supply of the want token"
      - name: want_price_usd
        description: "USD want price, at most 1 day older than the stats"
