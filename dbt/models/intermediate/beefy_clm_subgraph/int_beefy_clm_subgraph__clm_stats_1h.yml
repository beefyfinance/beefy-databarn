version: 2

models:
  - name: int_beefy_clm_subgraph__clm_stats_1h
    description: "Hourly CLM stats from the subgraph, one row per (chain_id, product_address, date_hour). Fallback for TVL, share price and LP breakdown columns."
    config:
      meta:
        primary_key: ["chain_id", "product_address", "date_hour"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chain_id
              - product_address
              - date_hour
    columns:
      - name: chain_id
        description: "Chain ID where the CLM exists"
        tests:
          - not_null
      - name: product_address
        description: "CLM manager address"
        tests:
          - not_null
      - name: date_hour
        description: "Hour of the snapshot"
        tests:
          - not_null
      - name: token0_representation_address
        description: "First pool token"
      - name: token1_representation_address
        description: "Second pool token"
      - name: balance0
        description: "token0 held by the CLM, in whole tokens"
      - name: balance1
        description: "token1 held by the CLM, in whole tokens"
      - name: manager_total_supply
        description: "CLM share supply, in whole shares"
      - name: tvl_usd
        description: "USD value of both balances, priced through the pool price. Null when neither token has a price."
      - name: share_token_price_usd
        description: "tvl_usd per share"
