version: 2

models:
  - name: int_beefy_clm_subgraph__share_price_1h
    description: "Hourly share price (USD per 1e18 raw share units) of every CLM manager and classic vault indexed by the CLM subgraph, whether the Beefy API lists it or not. History starts at deployment, before the API lists a product. Fallback series of fact_asset_price_5m (through int_price_obs): used after an hour with no API, databarn or oracle value, and the only source of products the API does not list."
    config:
      meta:
        primary_key: ["chain_id", "product_address", "date_hour"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            where: "date_hour >= toStartOfHour(now('UTC')) - interval 7 day"
          arguments:
            combination_of_columns:
              - chain_id
              - product_address
              - date_hour
    columns:
      - name: chain_id
        description: "Chain ID"
        data_type: Int64
        tests:
          - not_null
      - name: product_address
        description: "CLM manager or classic vault address (the share token)"
        data_type: String
        tests:
          - not_null
      - name: product_type
        description: "clm_manager or classic_vault"
        data_type: LowCardinality(String)
        tests:
          - accepted_values:
              arguments:
                values: ['clm_manager', 'classic_vault']
      - name: date_hour
        description: "Hour start of the subgraph snapshot period"
        data_type: DateTime('UTC')
        tests:
          - not_null
      - name: share_token_price_usd
        description: "USD value of 1e18 raw share units"
        data_type: Float64
        tests:
          - not_null
      - name: price_source
        description: "clm_subgraph (CLM manager) or classic_subgraph (classic vault)"
        data_type: LowCardinality(String)
        tests:
          - accepted_values:
              arguments:
                values: ['clm_subgraph', 'classic_subgraph']
