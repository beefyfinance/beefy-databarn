version: 2

models:
  - name: int_product_keys
    description: "Skinny product identity map (beefy_key / beefy_wants_price_oracle_key / share_token_symbol → chain_id + product_address). Used by intermediate models; display attributes live on product."
    config:
      meta:
        primary_key: ["chain_id", "product_address"]
    tests:
      - keys_match:
          name: int_product_keys_in_product
          config:
            store_failures: true
          arguments:
            to: ref('product')
            columns: ["chain_id", "product_address", "beefy_key", "beefy_wants_price_oracle_key"]
            to_columns: ["chain_id", "product_address", "beefy_key", "beefy_wants_price_oracle_key"]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chain_id
              - product_address
    columns:
      - name: chain_id
        description: "Chain ID where the product exists"
        data_type: Int64
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_chain_keys')
                field: chain_id
      - name: product_address
        description: "Product contract address"
        data_type: String
        tests:
          - not_null
      - name: beefy_key
        description: "Beefy vault/product identifier (1:1 with product)"
        data_type: String
        tests:
          - not_null
          - unique
      - name: beefy_wants_price_oracle_key
        description: "Beefy API oracleId (coalesce of API oracle_id and beefy_key) of the product's beefy wants (deposit) token, not the vault share. Not unique; one oracle maps to many products. Never use it to price shares."
        data_type: String
        tests:
          - not_null
      - name: beefy_wants_price_oracle_type
        description: "API oracle type of the beefy wants token (lps vs tokens), not the vault share. Null when the product has no vault oracle."
        data_type: Nullable(String)
      - name: beefy_wants_price_oracle_id
        description: "Numeric beefy-db price oracle id (stg_beefy_db__price_oracles.id) of the beefy wants token, not the vault share. Null when beefy_wants_price_oracle_key is missing from price_oracles."
        data_type: Nullable(String)
      - name: share_token_symbol
        description: "Vault share (moo) token symbol (API earnedToken). Join key to /mootokenprices. Null for boosts, whose earned token is a reward token."
        data_type: Nullable(String)
