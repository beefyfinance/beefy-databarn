version: 2

models:
  - name: int_product_stats__apy_breakdown_hourly
    description: "Hourly APY breakdown aggregations"
    tests:
      - keys_match:
          name: int_product_stats__apy_breakdown_hourly_in_int_product_keys
          config:
            store_failures: true
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address"]
      - keys_match:
          name: int_product_stats__apy_breakdown_hourly_in_unified
          config:
            store_failures: true
            where: "date_hour >= toStartOfHour(now('UTC')) - interval 30 day and date_hour < toStartOfHour(now('UTC')) - interval 1 day"
          arguments:
            to: ref('int_product_stats__unified_hourly')
            columns: ["chain_id", "product_address", "date_hour"]
            to_where: "date_hour >= toStartOfHour(now('UTC')) - interval 30 day and date_hour < toStartOfHour(now('UTC')) - interval 1 day"
    columns:
      - name: compoundings_per_year
        description: "Number of compoundings per year"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000
                inclusive: true
      - name: beefy_performance_fee
        description: "Beefy performance fee"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000
                inclusive: true
      - name: lp_fee
        description: "LP fee"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000
                inclusive: true
      - name: total_apy
        description: "Total APY"
        data_type: float64
        constraints:
          - type: not_null
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: vault_apr
        description: "Vault APR"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: trading_apr
        description: "Trading APR"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: clm_apr
        description: "CLM APR"
