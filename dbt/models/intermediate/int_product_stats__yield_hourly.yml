version: 2

models:
  - name: int_product_stats__yield_hourly
    description: "Hourly yield aggregations"
    tests:
      - keys_match:
          name: int_product_stats__yield_hourly_in_int_product_keys
          config:
            store_failures: true
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address"]
      - keys_match:
          name: int_product_stats__yield_hourly_in_int_yield
          config:
            store_failures: true
            where: "date_hour >= toStartOfHour(now('UTC')) - interval 30 day"
          arguments:
            to: ref('int_yield')
            columns: ["chain_id", "product_address", "date_hour"]
            to_columns:
              - chain_id
              - product_address
              - toStartOfHour(txn_timestamp)
            to_where: "txn_timestamp >= toStartOfHour(now('UTC')) - interval 30 day"
      # 30-day window: a full-history EXCEPT against unified takes ~1 min.
      # Latest day excluded; unified incremental reloads with a 1-day lag.
      # No source filter: CoalescingMergeTree folds every source into one row.
      - keys_match:
          name: int_product_stats__yield_hourly_in_unified
          config:
            store_failures: true
            where: "date_hour >= toStartOfHour(now('UTC')) - interval 30 day and date_hour < toStartOfHour(now('UTC')) - interval 1 day"
          arguments:
            to: ref('int_product_stats__unified_hourly')
            columns: ["chain_id", "product_address", "date_hour"]
            to_where: "date_hour >= toStartOfHour(now('UTC')) - interval 30 day and date_hour < toStartOfHour(now('UTC')) - interval 1 day"
    columns:
      - name: underlying_amount_compounded
        description: "Underlying amount compounded"
        data_type: float64
        constraints:
          - type: not_null
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000000
                inclusive: true
      - name: underlying_token_price_usd
        description: "Underlying token price in USD"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
                inclusive: true
      - name: underlying_amount_compounded_usd
        description: "Underlying amount compounded in USD"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000000000
                inclusive: true
