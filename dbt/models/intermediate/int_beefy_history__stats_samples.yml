version: 2

models:
  - name: int_beefy_history__stats_samples
    description: >
      Sample instants for /stats stacked charts: Mondays, month-starts, and stats_end.
      Grain is sampled_at (unix seconds). Empty when no counted vault exists.
    config:
      meta:
        primary_key: ["sampled_at"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sampled_at
    columns:
      - name: sampled_at
        description: "Unix seconds (UTC)"
        tests:
          - not_null
          - unique
      - name: sampled_at_ts
        description: "sampled_at as DateTime64 UTC"
      - name: is_end
        description: "This sample is stats_end"
      - name: is_monday
        description: "00:00 UTC Monday"
      - name: is_month_start
        description: "00:00 UTC on the first of a month"
