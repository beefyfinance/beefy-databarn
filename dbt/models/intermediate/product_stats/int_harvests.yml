version: 2

models:
  - name: int_harvests
    description: "Harvest events from stg_beefy_db__harvests priced with fact_asset_price_5m on the harvest's 5-minute slot (want, native, platform fee token); the price beefy-db stored with the harvest when the series has none. Corrections are part of the series. Applies the < $30M harvest USD sanity check on the resolved price. Incremental, re-priced when the resolver recomputes a want, native or fee price (int_price_runs). Read by int_product_stats__harvest_1h and fact_harvest_obs."
    tests:
      # fact_asset_price_5m is unique per (asset, slot), so the price joins must not fan out harvests
      # (rows can only be dropped by the sanity cap).
      - dbt_utils.fewer_rows_than:
          name: int_harvests_no_fanout
          arguments:
            compare_model: ref('stg_beefy_db__harvests')
      - dbt_utils.expression_is_true:
          name: int_harvests_usd_below_sanity_cap
          arguments:
            expression: "harvest_amount * want_price < 30000000"
    columns:
      - name: network_id
        description: "Network ID where the harvest occurred"
        data_type: Int64
        tests:
          - not_null
      - name: txn_timestamp
        description: "Harvest transaction timestamp"
        data_type: DateTime('UTC')
        tests:
          - not_null
      - name: vault_beefy_key
        description: "Beefy vault id of the harvested product"
        data_type: LowCardinality(String)
        tests:
          - not_null
      - name: want_price
        description: "USD price of the beefy wants token at the harvest's slot (fact_asset_price_5m, else the stored harvest price)"
        data_type: Float64
        tests:
          - not_null
      - name: native_price
        description: "USD price of the chain's native gas token at the harvest's slot (fact_asset_price_5m, else the stored harvest price)"
        data_type: Float64
        tests:
          - not_null
      - name: want_asset_id
        description: "Price series of want_price (asset.asset_id); NULL when the product has no want oracle"
        data_type: Nullable(UInt64)
      - name: native_asset_id
        description: "Price series of native_price (asset.asset_id); NULL when the chain has no native oracle"
        data_type: Nullable(UInt64)
      - name: platform_fee_price
        description: "USD price of the token platform fees are paid in: native, frxETH on Fraxtal"
        data_type: Float64
        tests:
          - not_null
      - name: want_price_source
        description: "fact_asset_price_5m.price_source of want_price, 'harvest' for the stored harvest price"
        data_type: LowCardinality(String)
        tests:
          - not_null
      - name: native_price_source
        description: "fact_asset_price_5m.price_source of native_price, 'harvest' for the stored harvest price"
        data_type: LowCardinality(String)
        tests:
          - not_null
      - name: is_want_price_corrected
        description: "True when want_price comes from int_price_oracle_corrections"
        data_type: Bool
        tests:
          - not_null
      - name: is_native_price_corrected
        description: "True when native_price comes from int_price_oracle_corrections"
        data_type: Bool
        tests:
          - not_null
