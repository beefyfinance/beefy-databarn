version: 2

models:
  - name: int_product_stats__tracking
    description: >
      When product stats stop: 3 months after the product retires or its chain goes eol, whichever comes first.
      One row per product of int_product_keys. Read by the product_is_tracked() macro, the HAVING of the hourly
      snapshot models (tvl, apy, apy_breakdown, lps_breakdown, share_price; not harvests or yield).
      Rows written before the cutoff took effect are kept.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["chain_id", "product_address"]
      - keys_match:
          name: int_product_stats__tracking_in_int_product_keys
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address"]
    columns:
      - name: chain_id
        description: "Chain id"
        tests:
          - not_null
      - name: product_address
        description: "Product address"
        tests:
          - not_null
      - name: retired_at
        description: >
          When the product retired: the API's retired_at for eol vaults, CLMs and reward pools, databarn v1's eol date
          for vaults gone from the API, a boost's period_finish or the retirement of the vault it stakes.
      - name: chain_eol_at
        description: "When the chain went eol (beefy-v2 chain config)"
      - name: tracked_until
        description: "Last moment stats are produced (exclusive): the earlier of retired_at and chain_eol_at, plus 3 months. Null while both are null."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or tracked_until > '2020-01-01'"
