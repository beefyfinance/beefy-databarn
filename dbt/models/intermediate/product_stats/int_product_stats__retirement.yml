version: 2

models:
  - name: int_product_stats__retirement
    description: >
      When each product retired and when its chain went eol, and until when databarn v1 data is used for it.
      One row per product of int_product_keys.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["chain_id", "product_address"]
      - keys_match:
          name: int_product_stats__retirement_in_int_product_keys
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address"]
    columns:
      - name: chain_id
        description: "Chain id"
        tests:
          - not_null
      - name: product_address
        description: "Product address"
        tests:
          - not_null
      - name: retired_at
        description: >
          When the product retired: the API's retired_at for eol vaults, CLMs and reward pools, databarn v1's eol date
          for vaults gone from the API, a boost's period_finish or the retirement of the vault it stakes.
      - name: chain_eol_at
        description: "When the chain went eol (beefy-v2 chain config)"
      - name: databarn_v1_until
        description: "Last moment databarn v1 data is used (exclusive): the earlier of retired_at and chain_eol_at, plus 1 month (v1 stops importing a vault about 30 days after its eol). Null while both are null."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or databarn_v1_until > '2020-01-01'"
