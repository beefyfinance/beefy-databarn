version: 2

models:
  - name: int_product_share_price
    description: "Incremental product share-to-USD prices from Beefy API moo-token snapshots (/mootokenprices only, for now), keyed via int_product_keys, on a 5-minute slot grain matching the beefy_api dlt cadence. New snapshots load with a 1-day lookback; generated points from int_mootoken_price_corrections always override the raw snapshot of the same slot. ReplacingMergeTree(__rmt_version): read with FINAL (duplicates per key exist until merge, so no uniqueness test)."
    config:
      meta:
        primary_key: ["chain_id", "product_address", "date_time"]
    tests:
      - keys_match:
          name: int_product_share_price_in_int_product_keys
          config:
            store_failures: true
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address"]
    columns:
      - name: chain_id
        description: "Chain ID where the product exists"
        data_type: Int64
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_chain_keys')
                field: chain_id
      - name: product_address
        description: "Product share-token contract address"
        data_type: String
        tests:
          - not_null
      - name: beefy_key
        description: "Beefy vault/product identifier"
        data_type: String
        tests:
          - not_null
      - name: date_time
        description: "5-minute slot (toStartOfFiveMinutes of the snapshot time)"
        data_type: DateTime('UTC')
        tests:
          - not_null
      - name: share_token_price_usd
        description: "USD value of one vault share. Latest moo snapshot of the slot, or the interpolated correction when one exists for the slot (after FINAL)."
        data_type: Decimal(76, 20)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: price_source
        description: "api = moo snapshot; interpolated = generated by int_mootoken_price_corrections"
        data_type: String
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['api', 'interpolated']
      - name: __rmt_version
        description: "ReplacingMergeTree version: (run unix time * 2 + is_correction) * 300 + seconds into the 5-minute slot. Latest run wins; within a run corrections win, then the latest raw value of the slot."
        data_type: UInt64
        tests:
          - not_null
