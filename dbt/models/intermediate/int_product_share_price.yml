version: 2

models:
  - name: int_product_share_price
    description: "Incremental product share-to-USD prices, keyed via int_product_keys, on a 5-minute slot grain matching the beefy_api dlt cadence. Classic vaults use Beefy API moo-token snapshots, then databarn v1 ppfs for history. CLM managers and reward pools use their beefy_db oracle hourly, then the CLM subgraph. New rows load with a 1-day lookback; generated points from int_mootoken_price_corrections always override the raw snapshot of the same slot. ReplacingMergeTree(__rmt_version): read with FINAL (duplicates per key exist until merge, so no uniqueness test)."
    config:
      meta:
        primary_key: ["chain_id", "product_address", "date_time"]
        # make dbt reimport/refresh run this model one month at a time (a full history of
        # stats joined to oracle prices does not fit in 30 GiB); see infra/dbt/run_dbt_batched.py.
        batch: month
        batch_start: "2020-01-01"
    tests:
      - keys_match:
          name: int_product_share_price_in_int_product_keys
          config:
            store_failures: true
          arguments:
            to: ref('int_product_keys')
            columns: ["chain_id", "product_address"]
    columns:
      - name: chain_id
        description: "Chain ID where the product exists"
        data_type: Int64
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_chain_keys')
                field: chain_id
      - name: product_address
        description: "Product share-token contract address"
        data_type: String
        tests:
          - not_null
      - name: beefy_key
        description: "Beefy vault/product identifier"
        data_type: String
        tests:
          - not_null
      - name: date_time
        description: "5-minute slot (toStartOfFiveMinutes of the snapshot time)"
        data_type: DateTime('UTC')
        tests:
          - not_null
      - name: share_token_price_usd
        description: "USD value of one vault share, meaning 1e18 raw share units. Shares are minted 1:1 with want units, so a non-18-decimal want reads far from the want price (a USDC vault is about 1e12 * ppfs). Latest value of the slot, or the interpolated correction when one exists for the slot (after FINAL)."
        data_type: Decimal(76, 20)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: price_source
        description: "api = moo snapshot; databarn_v1 = databarn v1 ppfs (vault stats and share-rate price feeds) * want price; beefy_db = oracle of a CLM manager or reward pool share; clm_subgraph = CLM subgraph balances per share; interpolated = generated by int_mootoken_price_corrections"
        data_type: String
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['api', 'beefy_db', 'clm_subgraph', 'databarn_v1', 'interpolated']
      - name: __rmt_version
        description: "ReplacingMergeTree version: (run unix time * 2 + is_correction) * 300 + seconds into the 5-minute slot for moo snapshots and corrections. Latest run wins; within a run corrections win, then the latest raw value of the slot. databarn_v1 uses seconds into the slot, beefy_db 1 and clm_subgraph 0, so those always lose to a snapshot and the oracle beats the subgraph."
        data_type: UInt64
        tests:
          - not_null
