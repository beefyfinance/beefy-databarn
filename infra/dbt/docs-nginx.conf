server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    etag on;
    if_modified_since exact;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/html application/javascript application/json application/xml;

    location = /healthz {
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 200 "ok\n";
    }

    # Docglow uses history-API paths (e.g. /erd). The publish volume only contains
    # index.html, so unknown paths fall back to the SPA without exposing other files.
    location / {
        add_header Cache-Control "public, max-age=60, s-maxage=3600, stale-while-revalidate=86400" always;
        try_files $uri @index;
    }

    location @index {
        add_header Cache-Control "public, max-age=60, s-maxage=3600, stale-while-revalidate=86400" always;
        try_files /index.html =404;
    }
}
